[package]
name = "nebula-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nebula-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
nix = { version = "0.31", features = ["process", "fs", "signal", "term"] }
tokio-util = "0.7"
rand = "0.10"
subtle = "2"
tempfile = "3"
vt100 = "0.16"
# Outbound HTTP for provider adapters (Jira/Bitbucket). rustls, not OpenSSL,
# so the musl release targets stay buildable (execution-plan D2). This tree is
# the only place the daemon makes network calls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

[dev-dependencies]
